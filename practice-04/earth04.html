<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>earth04 · 交互特效</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;color:#eaf2ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;left:24px;top:22px;z-index:2;pointer-events:none}.title{font-size:25px;font-weight:700}.sub{margin-top:6px;color:#91a4bd;font-size:13px}.panel{position:fixed;right:22px;top:22px;width:285px;padding:16px;border:1px solid #26384d;border-radius:14px;background:rgba(7,17,31,.88);z-index:3}.panel h3{margin:0 0 10px;font-size:15px}.panel p{margin:7px 0;color:#b9c6d6;font-size:13px;line-height:1.55}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #31465f;background:#102137;color:#dbe8f7;border-radius:8px;padding:7px 10px;cursor:pointer}.btn:hover{background:#18304b}.nav{position:fixed;left:24px;bottom:20px;z-index:3}.nav a{color:#b8d7ff;text-decoration:none;margin-right:14px;font-size:13px}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:#12263b;color:#9ec8ef;font-size:11px;margin-bottom:8px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="title">earth04 · 交互特效</div><div class="sub">建立在 earth03 城市系统之上</div></div><div class="panel"><span class="tag">继承 earth03</span><h3>交互特效</h3><p>保留前面全部内容，增加两点城市之间的大圆弧、卫星轨道和更明显的交互反馈。</p></div><div class="nav"><a href="earth03.html">← 上一节</a><a href="index.html">返回导航</a><a href="earth05.html">下一节 →</a></div><script>const CITIES=[{"name":"北京","lat":39.9042,"lon":116.4074,"tz":"Asia/Shanghai"},{"name":"东京","lat":35.6762,"lon":139.6503,"tz":"Asia/Tokyo"},{"name":"伦敦","lat":51.5074,"lon":-0.1278,"tz":"Europe/London"},{"name":"纽约","lat":40.7128,"lon":-74.006,"tz":"America/New_York"},{"name":"开罗","lat":30.0444,"lon":31.2357,"tz":"Africa/Cairo"}];
function cities(){for(const c of CITIES){let p=rot(c.lat,c.lon);if(p[2]<.04)continue;let q=proj(p);ctx.fillStyle="#ffcf66";ctx.beginPath();ctx.arc(q[0],q[1],4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f3f7fb";ctx.font="12px system-ui";ctx.fillText(c.name,q[0]+7,q[1]-7)}}
function arc(a,b){let A=rot(a.lat,a.lon),B=rot(b.lat,b.lon),dot=A[0]*B[0]+A[1]*B[1]+A[2]*B[2],ang=Math.acos(Math.max(-1,Math.min(1,dot)));ctx.strokeStyle="rgba(255,197,88,.8)";ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<=80;i++){let t=i/80,s=ang?Math.sin(ang):1,x=Math.sin((1-t)*ang)/s*A[0]+Math.sin(t*ang)/s*B[0],y=Math.sin((1-t)*ang)/s*A[1]+Math.sin(t*ang)/s*B[1],z=Math.sin((1-t)*ang)/s*A[2]+Math.sin(t*ang)/s*B[2],q=proj([x,y,z]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}ctx.stroke()}
function satellite(t){ctx.strokeStyle="rgba(120,220,255,.65)";ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=160;i++){let a=i/160*Math.PI*2,lat=.18*Math.sin(a*2),lon=a*180/Math.PI+rotY*180/Math.PI, p=rot(lat*180/Math.PI,lon),q=proj([p[0]*1.13,p[1]*1.13,p[2]*1.13]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}ctx.stroke()}
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");let W=innerWidth,H=innerHeight,D=devicePixelRatio||1,R=300,rotY=0,rotX=0,zoom=1,drag=false,px=0,py=0,auto=false;
function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);R=Math.min(W*.34,H*.43)*zoom}addEventListener("resize",resize);resize();
function rot(lat,lon){let a=lon*Math.PI/180+rotY,b=lat*Math.PI/180,cb=Math.cos(b),x=cb*Math.cos(a),y=Math.sin(b),z=cb*Math.sin(a),cy=Math.cos(rotX),sy=Math.sin(rotX);return [x,y*cy-z*sy,y*sy+z*cy]}
function proj(p){return [W/2+p[0]*R,H/2-p[1]*R,p[2]]}
function globe(){ctx.fillStyle="#102d47";ctx.beginPath();ctx.arc(W/2,H/2,R,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(160,205,238,.28)";ctx.lineWidth=1;ctx.stroke()}
function grid(){ctx.strokeStyle="rgba(153,194,226,.18)";ctx.lineWidth=.7;for(let lat=-60;lat<=60;lat+=30){let s=false;ctx.beginPath();for(let lon=-180;lon<=180;lon+=3){let p=rot(lat,lon);if(p[2]<0){s=false;continue}let q=proj(p);if(!s){ctx.moveTo(q[0],q[1]);s=true}else ctx.lineTo(q[0],q[1])}ctx.stroke()}for(let lon=-150;lon<=180;lon+=30){let s=false;ctx.beginPath();for(let lat=-90;lat<=90;lat+=3){let p=rot(lat,lon);if(p[2]<0){s=false;continue}let q=proj(p);if(!s){ctx.moveTo(q[0],q[1]);s=true}else ctx.lineTo(q[0],q[1])}ctx.stroke()}}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#050c16");g.addColorStop(1,"#0b1c2c");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
canvas.onpointerdown=e=>{drag=true;auto=false;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;rotY+=(e.clientX-px)*.008;rotX+=(e.clientY-py)*.006;rotX=Math.max(-1.2,Math.min(1.2,rotX));px=e.clientX;py=e.clientY};canvas.onpointerup=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();zoom*=e.deltaY<0?1.08:.93;zoom=Math.max(.72,Math.min(1.5,zoom));resize()};
function frame(t){if(auto&&!drag)rotY+=.0018;ctx.clearRect(0,0,W,H);bg();globe();grid();cities();arc(CITIES[1],CITIES[3]);satellite(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
