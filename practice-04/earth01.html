<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>earth01 · 基础球体</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;color:#eaf2ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;left:24px;top:22px;z-index:2;pointer-events:none}.title{font-size:25px;font-weight:700}.sub{margin-top:6px;color:#91a4bd;font-size:13px}.panel{position:fixed;right:22px;top:22px;width:285px;padding:16px;border:1px solid #26384d;border-radius:14px;background:rgba(7,17,31,.88);z-index:3}.panel h3{margin:0 0 10px;font-size:15px}.panel p{margin:7px 0;color:#b9c6d6;font-size:13px;line-height:1.55}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #31465f;background:#102137;color:#dbe8f7;border-radius:8px;padding:7px 10px;cursor:pointer}.btn:hover{background:#18304b}.nav{position:fixed;left:24px;bottom:20px;z-index:3}.nav a{color:#b8d7ff;text-decoration:none;margin-right:14px;font-size:13px}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:#12263b;color:#9ec8ef;font-size:11px;margin-bottom:8px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="title">earth01 · 基础球体</div><div class="sub">球体 → 后续所有章节的共同基础</div></div><div class="panel"><span class="tag">基础</span><h3>球体模型</h3><p>第一节只建立地球球体与拖拽/缩放基础，后续页面在此基础上继续增加地理内容。</p></div><div class="nav"><a href="index.html">返回导航</a><a href="earth02.html">下一节 →</a></div><script>const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");let W=innerWidth,H=innerHeight,D=devicePixelRatio||1,R=300,rotY=0,rotX=0,zoom=1,drag=false,px=0,py=0,auto=false;
function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);R=Math.min(W*.34,H*.43)*zoom}addEventListener("resize",resize);resize();
function rot(lat,lon){let a=lon*Math.PI/180+rotY,b=lat*Math.PI/180,cb=Math.cos(b),x=cb*Math.cos(a),y=Math.sin(b),z=cb*Math.sin(a),cy=Math.cos(rotX),sy=Math.sin(rotX);return [x,y*cy-z*sy,y*sy+z*cy]}
function proj(p){return [W/2+p[0]*R,H/2-p[1]*R,p[2]]}
function globe(){ctx.fillStyle="#102d47";ctx.beginPath();ctx.arc(W/2,H/2,R,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(160,205,238,.28)";ctx.lineWidth=1;ctx.stroke()}
function grid(){ctx.strokeStyle="rgba(153,194,226,.18)";ctx.lineWidth=.7;for(let lat=-60;lat<=60;lat+=30){let s=false;ctx.beginPath();for(let lon=-180;lon<=180;lon+=3){let p=rot(lat,lon);if(p[2]<0){s=false;continue}let q=proj(p);if(!s){ctx.moveTo(q[0],q[1]);s=true}else ctx.lineTo(q[0],q[1])}ctx.stroke()}for(let lon=-150;lon<=180;lon+=30){let s=false;ctx.beginPath();for(let lat=-90;lat<=90;lat+=3){let p=rot(lat,lon);if(p[2]<0){s=false;continue}let q=proj(p);if(!s){ctx.moveTo(q[0],q[1]);s=true}else ctx.lineTo(q[0],q[1])}ctx.stroke()}}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#050c16");g.addColorStop(1,"#0b1c2c");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
canvas.onpointerdown=e=>{drag=true;auto=false;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;rotY+=(e.clientX-px)*.008;rotX+=(e.clientY-py)*.006;rotX=Math.max(-1.2,Math.min(1.2,rotX));px=e.clientX;py=e.clientY};canvas.onpointerup=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();zoom*=e.deltaY<0?1.08:.93;zoom=Math.max(.72,Math.min(1.5,zoom));resize()};
function frame(t){if(auto&&!drag)rotY+=.0018;ctx.clearRect(0,0,W,H);bg();globe();requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
