<script>
/* 参与时钟演示的城市 */
const CITIES = [
  {name:'北京', lat: 39.9042, lon: 116.4074, tz:'Asia/Shanghai'},
  {name:'东京', lat: 35.6762, lon: 139.6503, tz:'Asia/Tokyo'},
  {name:'伦敦', lat: 51.5074, lon:  -0.1278, tz:'Europe/London'},
  {name:'纽约', lat: 40.7128, lon: -74.0060, tz:'America/New_York'},
  {name:'开罗', lat: 30.0444, lon:  31.2357, tz:'Africa/Cairo'}
];

const DEG = Math.PI/180;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W=0, H=0, DPR=1, R=320;
let rotY = 0.52, rotX = -0.26, zoom = 1, spin = 0;
let auto = true;
let dragging=false, lastX=0, lastY=0;

function layout(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width  = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width  = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  R = Math.min(W*0.30, H*0.42) * zoom;
  buildStars();
  onLayout();
}
function CX(){ return W/2 - Math.min(186, W*0.10); }
function CY(){ return H/2; }

/* 地球固定坐标系：X → (0°N,0°E)，Y → 北极，Z → (0°N,90°E) */
function ef(lat, lon, r){
  if(r === undefined) r = 1;
  const la = lat*DEG, lo = lon*DEG, cl = Math.cos(la);
  return [r*cl*Math.cos(lo), r*Math.sin(la), r*cl*Math.sin(lo)];
}
/* theta：视角绕地轴的偏航角。地球上各点叠加自转 spin，太阳/卫星不叠加 */
function viewOf(p, theta){
  const ct = Math.cos(theta), st = Math.sin(theta);
  let x = p[0]*ct - p[2]*st;
  let z = p[2]*ct + p[0]*st;
  let y = p[1];
  const c = Math.cos(rotX), s = Math.sin(rotX);
  let y2 = y*c - z*s, z2 = y*s + z*c;
  return extraTilt(x, y2, z2);
}
function extraTilt(x, y, z){ return [x, y, z]; }   /* earth05：无地轴倾斜 */
function toView(lat, lon, r){ return viewOf(ef(lat,lon,r), spin*DEG + rotY); }
function PX(v){ return CX() + v[0]*R; }
function PY(v){ return CY() - v[1]*R; }

/* --------------------------- 背景星空 --------------------------- */
let stars = [];
function buildStars(){
  let seed = 987654321;
  const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  stars = [];
  const n = Math.round(W*H/3200);
  for(let i=0;i<n;i++) stars.push(rnd()*W, rnd()*H, rnd()*1.4+.3, rnd()*.5+.12);
}
function drawBG(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#03080f'); g.addColorStop(1,'#07131f');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<stars.length;i+=4){
    ctx.fillStyle = 'rgba(226,240,255,'+stars[i+3].toFixed(3)+')';
    ctx.fillRect(stars[i], stars[i+1], stars[i+2], stars[i+2]);
  }
}
function drawGlobe(){
  const cx = CX(), cy = CY();
  const g = ctx.createRadialGradient(cx-R*0.36, cy-R*0.40, R*0.06, cx, cy, R*1.08);
  g.addColorStop(0,'#3f8fc4'); g.addColorStop(0.42,'#1f5f8e');
  g.addColorStop(0.78,'#123f60'); g.addColorStop(1,'#08202f');
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle = g; ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  const rim = ctx.createRadialGradient(cx,cy,R*0.80,cx,cy,R);
  rim.addColorStop(0,'rgba(150,215,255,0)');
  rim.addColorStop(1,'rgba(150,215,255,.30)');
  ctx.fillStyle = rim; ctx.fillRect(cx-R,cy-R,R*2,R*2);
  ctx.restore();
  drawNoise();
}
/* 大面积平滑渐变在 8 位色深下会出现同心色带，叠一层极低透明度噪点即可打散 */
let noisePat = null;
function drawNoise(){
  const cx = CX(), cy = CY();
  if(!noisePat){
    const n = document.createElement('canvas');
    n.width = n.height = 96;
    const g = n.getContext('2d');
    const img = g.createImageData(96,96);
    let seed = 20240921;
    for(let i=0;i<img.data.length;i+=4){
      seed = (seed*1103515245 + 12345) & 0x7fffffff;
      const v = (seed >>> 16) & 255;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 255;
    }
    g.putImageData(img,0,0);
    noisePat = ctx.createPattern(n, 'repeat');
  }
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  ctx.globalAlpha = 0.032;
  ctx.fillStyle = noisePat;
  ctx.fillRect(cx-R, cy-R, R*2, R*2);
  ctx.restore();
}
function strokeCurve(pts, color, width, dash){
  ctx.save();
  if(dash) ctx.setLineDash(dash);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin='round';
  ctx.beginPath();
  let started=false, prev=null;
  for(let i=0;i<pts.length;i++){
    const v = toView(pts[i][0], pts[i][1]);
    if(v[2] >= 0){
      const x=PX(v), y=PY(v);
      if(started) ctx.lineTo(x,y); else { ctx.moveTo(x,y); started=true; }
      prev = v;
    }else{
      if(started && prev){
        const t = prev[2]/(prev[2]-v[2]);
        ctx.lineTo(CX()+(prev[0]+(v[0]-prev[0])*t)*R, CY()-(prev[1]+(v[1]-prev[1])*t)*R);
      }
      started=false; prev=null;
    }
  }
  ctx.stroke(); ctx.restore();
}
function parallel(lat){ const p=[]; for(let lon=-180;lon<=180;lon+=4) p.push([lat,lon]); return p; }
function meridian(lon){ const p=[]; for(let lat=-90;lat<=90;lat+=4) p.push([lat,lon]); return p; }
function drawGrid(){
  for(let lat=-60; lat<=60; lat+=30){
    if(lat===0) continue;
    strokeCurve(parallel(lat), 'rgba(153,194,226,.18)', 1);
  }
  for(let lon=-180; lon<180; lon+=30){
    if(lon===0) continue;
    strokeCurve(meridian(lon), 'rgba(153,194,226,.18)', 1);
  }
  strokeCurve(parallel(0), 'rgba(255,209,102,.42)', 1.4);   // 赤道
  strokeCurve(meridian(0), 'rgba(95,216,255,.34)', 1.2);    // 本初子午线
}
function drawCities(){
  for(const c of CITIES){
    const v = toView(c.lat, c.lon);
    if(v[2] <= 0.02) continue;
    const x = PX(v), y = PY(v), rad = 3.4 + v[2]*2.4;
    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2);
    ctx.fillStyle = '#ffcf66'; ctx.fill();
    ctx.strokeStyle='rgba(6,17,29,.85)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillStyle = '#eef5ff'; ctx.font = '13px system-ui';
    ctx.fillText(c.name, x + rad + 6, y - rad - 4);
  }
}

/* --------------------------- 交互 --------------------------- */
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId); canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointermove', e => {
  if(!dragging) return;
  rotY += (e.clientX-lastX)*0.0085;
  rotX += (e.clientY-lastY)*0.0062;
  rotX = Math.max(-1.25, Math.min(1.25, rotX));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointerup', e => {
  dragging = false; canvas.style.cursor='grab';
  try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.65, Math.min(1.7, zoom*(e.deltaY<0?1.08:0.93)));
  layout();
}, {passive:false});
canvas.style.cursor = 'grab';
function onLayout(){}

const FLAT = new Float32Array(38513*3);
const RANGE = new Int32Array(2978*2);
(function prepare(){
  let o = 0;
  for(let i=0;i<COAST.length;i++){
    const line = COAST[i];
    RANGE[i*2] = o; RANGE[i*2+1] = line.length;
    for(let j=0;j<line.length;j++){
      const lon = line[j][0]*DEG, lat = line[j][1]*DEG, cl = Math.cos(lat);
      FLAT[o*3]   = cl*Math.cos(lon);
      FLAT[o*3+1] = Math.sin(lat);
      FLAT[o*3+2] = cl*Math.sin(lon);
      o++;
    }
  }
})();

/* 一次性组好整条路径再 stroke，比逐条 stroke 快得多 */
function drawCoast(){
  const th = spin*DEG + rotY;
  const c = Math.cos(th), s = Math.sin(th);
  const cp = Math.cos(rotX), sp = Math.sin(rotX);
  const m0 = c,      m1 = 0,  m2 = -s;
  const m3 = -sp*s,  m4 = cp, m5 = -sp*c;
  const m6 = cp*s,   m7 = sp, m8 = cp*c;
  const cx = CX(), cy = CY();
  ctx.beginPath();
  for(let li=0; li<RANGE.length; li+=2){
    const off = RANGE[li], n = RANGE[li+1];
    let started = false, pxs = 0, pys = 0, pzs = 0;
    for(let i=0;i<n;i++){
      const o = (off+i)*3;
      const x = FLAT[o], y = FLAT[o+1], z = FLAT[o+2];
      const x1 = m0*x + m2*z;
      const y1 = m3*x + m4*y + m5*z;
      const z1 = m6*x + m7*y + m8*z;
      if(z1 >= 0){
        const sx = cx + x1*R, sy = cy - y1*R;
        if(started) ctx.lineTo(sx,sy); else { ctx.moveTo(sx,sy); started = true; }
        pxs = x1; pys = y1; pzs = z1;
      }else{
        if(started){
          const t = pzs/(pzs - z1);
          ctx.lineTo(cx + (pxs + (x1-pxs)*t)*R, cy - (pys + (y1-pys)*t)*R);
        }
        started = false;
      }
    }
  }
  ctx.strokeStyle = 'rgba(228,242,255,.92)';
  ctx.lineWidth = 1.05;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

let showNight = true;

/* -------- 用浏览器内置的 IANA 时区库换算地方时，全程不联网 -------- */
function localParts(tz, d){
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
  const p = {};
  for(const part of dtf.formatToParts(d)) p[part.type] = part.value;
  return p;
}
function offsetMinutes(tz, d){
  const p = localParts(tz, d);
  const asUTC = Date.UTC(+p.year, +p.month-1, +p.day, (+p.hour)%24, +p.minute, +p.second);
  return Math.round((asUTC - d.getTime())/60000);
}
function fmtOffset(min){
  const sign = min < 0 ? '-' : '+';
  const a = Math.abs(min);
  const h = Math.floor(a/60), m = a%60;
  return 'UTC' + sign + h + (m ? ':' + String(m).padStart(2,'0') : '');
}
function fmtTime(tz, d){
  return new Intl.DateTimeFormat('zh-CN', {
    timeZone: tz, hour12:false,
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).format(d);
}

/* --------------------------- 时钟面板 --------------------------- */
const box = document.getElementById('clocks');
box.innerHTML =
  '<div class="crow utc"><span class="cname">世界时</span>' +
  '<span class="ctime" id="t-utc">--:--:--</span>' +
  '<span class="ctz">UTC+0</span><span class="cb day" id="b-utc">—</span></div>' +
  CITIES.map((c,i) =>
    '<div class="crow"><span class="cname">'+c.name+'</span>' +
    '<span class="ctime" id="t'+i+'">--:--:--</span>' +
    '<span class="ctz" id="z'+i+'">—</span>' +
    '<span class="cb day" id="b'+i+'">—</span></div>').join('');

const tUtc = document.getElementById('t-utc');
const bUtc = document.getElementById('b-utc');
const tEls = CITIES.map((c,i) => document.getElementById('t'+i));
const zEls = CITIES.map((c,i) => document.getElementById('z'+i));
const bEls = CITIES.map((c,i) => document.getElementById('b'+i));

let lastTick = -1;
function tick(){
  const d = new Date();
  if(d.getSeconds() === lastTick) return;
  lastTick = d.getSeconds();

  tUtc.textContent = String(d.getUTCHours()).padStart(2,'0') + ':' +
                     String(d.getUTCMinutes()).padStart(2,'0') + ':' +
                     String(d.getUTCSeconds()).padStart(2,'0');

  CITIES.forEach((c,i) => {
    tEls[i].textContent = fmtTime(c.tz, d);
    zEls[i].textContent = fmtOffset(offsetMinutes(c.tz, d));
    // 以当地 6:00–18:00 记为白昼，用来对比"同一时刻各地的昼夜差别"
    const p = localParts(c.tz, d);
    const isDay = (+p.hour)%24 >= 6 && (+p.hour)%24 < 18;
    bEls[i].textContent = isDay ? '白昼' : '夜晚';
    bEls[i].className = 'cb ' + (isDay ? 'day' : 'night');
  });

  const uH = d.getUTCHours();
  const sunUp = uH >= 6 && uH < 18;
  bUtc.textContent = sunUp ? '白昼' : '夜晚';
  bUtc.className = 'cb ' + (sunUp ? 'day' : 'night');
}
tick();
setInterval(tick, 250);

/* --------------- 简化的昼夜明暗：光源固定在右上方 --------------- */
function drawNightSoft(){
  const cx = CX(), cy = CY();
  const sx = cx + R*0.98, sy = cy - R*0.34;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  const g = ctx.createRadialGradient(sx, sy, R*0.10, sx, sy, R*2.10);
  g.addColorStop(0,   'rgba(0,0,0,0)');
  g.addColorStop(0.34,'rgba(0,0,0,.06)');
  g.addColorStop(0.62,'rgba(0,0,0,.28)');
  g.addColorStop(1,   'rgba(0,0,0,.66)');
  ctx.fillStyle = g;
  ctx.fillRect(cx-R, cy-R, R*2, R*2);
  ctx.restore();
}

function frame(){
  if(auto && !dragging){
    spin -= 0.0020;
    if(spin < -Math.PI*2) spin += Math.PI*2;
  }
  ctx.clearRect(0,0,W,H);
  drawBG();
  drawGlobe();
  drawCoast();
  drawGrid();
  if(showNight) drawNightSoft();
  drawCities();
  requestAnimationFrame(frame);
}

const bNight = document.getElementById('bNight');
bNight.onclick = () => { showNight = !showNight;
  bNight.textContent = '昼夜明暗：'+(showNight?'开':'关');
  bNight.classList.toggle('on', showNight); };
const bSpin = document.getElementById('bSpin');
bSpin.onclick = () => { auto = !auto;
  bSpin.textContent = '自转：'+(auto?'开':'关'); bSpin.classList.toggle('on', auto); };
document.getElementById('bReset').onclick = () => {
  rotY = 0.52; rotX = -0.26; zoom = 1; spin = 0; layout();
};

addEventListener('resize', layout);
layout();
requestAnimationFrame(frame);
