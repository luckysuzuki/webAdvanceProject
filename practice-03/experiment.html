<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验 - 学习通</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="experiment">

  <!-- 顶部导航栏 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-mark">学</span>学习通<small>STUDY</small>
      </a>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="text" placeholder="搜索课程 / 作业 / 资料">
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="消息通知">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="dot">3</span>
        </button>
        <div class="user" id="userBox" title="点击退出登录">
          <div class="avatar">张</div>
          <div>
            <div class="user-name">张同学</div>
            <div class="user-role user-code">某某大学 · 20230001</div>
          </div>
        </div>
        <button class="icon-btn" id="logoutBtn" title="退出登录">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主导航 -->
  <nav class="main-nav">
    <div class="main-nav-inner">
      <a class="nav-tab" data-nav="home" href="home.html">首页</a>
      <a class="nav-tab" data-nav="homework" href="homework.html">作业</a>
      <a class="nav-tab" data-nav="experiment" href="experiment.html">实验</a>
      <a class="nav-tab" data-nav="grades" href="grades.html">成绩统计</a>
    </div>
  </nav>

  <!-- 页面内容 -->
  <main class="page">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">我的实验</h1>
          <p class="page-sub">在线完成实验，提交实验报告。</p>
        </div>
      </div>

      <!-- 筛选 -->
      <div class="filter-tabs" id="expFilters">
        <button class="filter-tab active" data-filter="all">全部</button>
        <button class="filter-tab" data-filter="todo">未开始</button>
        <button class="filter-tab" data-filter="doing">进行中</button>
        <button class="filter-tab" data-filter="done">已完成</button>
      </div>

      <section class="card">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>实验名称</th>
                <th>状态</th>
                <th>截止时间</th>
                <th>实验报告</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="experimentBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    XLS.initShell();
    XLS.renderExperiments('all');

    document.getElementById('expFilters').addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-tab');
      if (!btn) return;
      document.querySelectorAll('#expFilters .filter-tab').forEach(function (t) { t.classList.remove('active'); });
      btn.classList.add('active');
      XLS.renderExperiments(btn.getAttribute('data-filter'));
    });
  </script>
</body>
</html>
