<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 学习通</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark">学</div>
        <h1>注册学习通账号</h1>
        <p>加入超星学习通，开启你的学习之旅</p>
      </div>

      <form id="regForm" novalidate>
        <div class="form-item" id="rNameItem">
          <label>姓名</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
            </span>
            <input class="form-input has-lead" id="regName" type="text" placeholder="请输入真实姓名">
          </div>
          <div class="err-msg" id="rNameErr">请输入姓名</div>
        </div>

        <div class="form-item" id="rPhoneItem">
          <label>手机号</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            </span>
            <input class="form-input has-lead" id="regPhone" type="text" placeholder="请输入手机号">
          </div>
          <div class="err-msg" id="rPhoneErr">请输入正确的 11 位手机号</div>
        </div>

        <div class="form-item" id="rCodeItem">
          <label>验证码</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 9l3.5 3.5L16 7"/></svg>
            </span>
            <input class="form-input has-lead" id="regCode" type="text" placeholder="请输入短信验证码">
            <button type="button" class="code-btn" id="regSendBtn">获取验证码</button>
          </div>
          <div class="err-msg" id="rCodeErr">请输入 6 位数字验证码</div>
        </div>

        <div class="form-item" id="rPassItem">
          <label>设置密码</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input class="form-input has-lead" id="regPass" type="password" placeholder="6 - 20 位密码">
          </div>
          <div class="err-msg" id="rPassErr">密码长度需为 6 - 20 位</div>
        </div>

        <div class="form-item" id="rPass2Item">
          <label>确认密码</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input class="form-input has-lead" id="regPass2" type="password" placeholder="请再次输入密码">
          </div>
          <div class="err-msg" id="rPass2Err">两次输入的密码不一致</div>
        </div>

        <label class="agree">
          <input type="checkbox" id="regAgree">
          <span>我已阅读并同意<a href="javascript:;">《学习通服务协议》</a>和<a href="javascript:;">《隐私政策》</a></span>
        </label>

        <button type="submit" class="btn btn-primary btn-block btn-lg">注 册</button>
      </form>

      <div class="auth-switch">已有账号？<a href="index.html">立即登录</a></div>
    </div>

    <div class="auth-footer" style="position:fixed;bottom:16px;left:0;right:0;color:rgba(255,255,255,.85);font-size:12px;">
      practice-03 · 学习通界面复刻（HTML + CSS + JavaScript）
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      'use strict';

      /* 验证码倒计时 */
      var sendBtn = document.getElementById('regSendBtn');
      var regPhone = document.getElementById('regPhone');
      sendBtn.addEventListener('click', function () {
        if (!/^1\d{10}$/.test(regPhone.value.trim())) {
          XLS.toast('请先输入正确的手机号', 'error');
          return;
        }
        XLS.toast('验证码已发送（演示：任意 6 位数字）', 'success');
        var countdown = 60;
        sendBtn.disabled = true;
        var timer = setInterval(function () {
          countdown--;
          sendBtn.textContent = countdown + 's 后重发';
          if (countdown <= 0) {
            clearInterval(timer);
            sendBtn.disabled = false;
            sendBtn.textContent = '获取验证码';
          }
        }, 1000);
      });

      document.getElementById('regForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = regName.value.trim();
        var phone = regPhone.value.trim();
        var code = regCode.value.trim();
        var pass = regPass.value;
        var pass2 = regPass2.value;
        var agree = document.getElementById('regAgree').checked;
        var ok = true;

        if (!name) { err('rNameItem', 'rNameErr', '请输入姓名'); ok = false; } else okClr('rNameItem');
        if (!/^1\d{10}$/.test(phone)) { err('rPhoneItem', 'rPhoneErr', '请输入正确的 11 位手机号'); ok = false; } else okClr('rPhoneItem');
        if (!/^\d{6}$/.test(code)) { err('rCodeItem', 'rCodeErr', '请输入 6 位数字验证码'); ok = false; } else okClr('rCodeItem');
        if (pass.length < 6 || pass.length > 20) { err('rPassItem', 'rPassErr', '密码长度需为 6 - 20 位'); ok = false; } else okClr('rPassItem');
        if (pass2 !== pass) { err('rPass2Item', 'rPass2Err', '两次输入的密码不一致'); ok = false; } else okClr('rPass2Item');
        if (!agree) { XLS.toast('请先阅读并同意服务协议', 'error'); ok = false; }

        if (!ok) return;

        var users = XLS.getUsers();
        if (users.some(function (u) { return u.phone === phone; })) {
          err('rPhoneItem', 'rPhoneErr', '该手机号已注册，请直接登录');
          return;
        }
        users.push({ name: name, phone: phone, account: phone, password: pass });
        XLS.saveUsers(users);
        XLS.toast('注册成功，正在为你自动登录……', 'success');
        localStorage.setItem('xxLoggedIn', name);
        setTimeout(function () { location.href = 'home.html'; }, 800);
      });

      function err(item, eid, msg) { document.getElementById(item).classList.add('has-error'); document.getElementById(eid).textContent = msg; }
      function okClr(item) { document.getElementById(item).classList.remove('has-error'); }
    })();
  </script>
</body>
</html>
