<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 学习通</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-mark">学</div>
        <h1>学习通</h1>
        <p>超星学习通 · 在线学习平台</p>
      </div>

      <!-- 登录方式选项卡 -->
      <div class="auth-tabs" id="authTabs">
        <button class="auth-tab active" data-tab="pwd">密码登录</button>
        <button class="auth-tab" data-tab="sms">短信登录</button>
      </div>

      <!-- 密码登录 -->
      <form id="pwdForm" novalidate>
        <div class="form-item" id="phoneItem">
          <label>账号 / 手机号</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            </span>
            <input class="form-input has-lead" id="pwdPhone" type="text" placeholder="请输入账号 / 手机号" autocomplete="username">
          </div>
          <div class="err-msg" id="pwdPhoneErr">请输入账号或手机号</div>
        </div>

        <div class="form-item" id="pwdItem">
          <label>密码</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input class="form-input has-lead" id="pwdPass" type="password" placeholder="请输入密码" autocomplete="current-password">
            <button type="button" class="suffix-btn" id="togglePwd" title="显示/隐藏密码">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
          </div>
          <div class="err-msg" id="pwdPassErr">请输入密码（不少于 6 位）</div>
        </div>

        <div class="form-row">
          <label class="check"><input type="checkbox" id="remember" checked> 记住我</label>
          <a class="link" href="javascript:;" onclick="XLS.toast('请联系任课老师重置密码','error')">忘记密码？</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">登 录</button>
      </form>

      <!-- 短信登录 -->
      <form id="smsForm" novalidate style="display:none">
        <div class="form-item">
          <label>手机号</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            </span>
            <input class="form-input has-lead" id="smsPhone" type="text" placeholder="请输入手机号">
          </div>
        </div>
        <div class="form-item">
          <label>验证码</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 9l3.5 3.5L16 7"/></svg>
            </span>
            <input class="form-input has-lead" id="smsCode" type="text" placeholder="请输入验证码">
            <button type="button" class="code-btn" id="smsSendBtn">获取验证码</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">登录 / 注册</button>
      </form>

      <div class="auth-hint">演示账号：13800000000 &nbsp;|&nbsp; 密码：123456</div>

      <div class="auth-switch">还没有账号？<a href="register.html">立即注册</a></div>
    </div>

    <div class="auth-footer" style="position:fixed;bottom:16px;left:0;right:0;color:rgba(255,255,255,.85);font-size:12px;">
      practice-03 · 学习通界面复刻（HTML + CSS + JavaScript）
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      'use strict';

      /* 选项卡切换 */
      var tabs = document.querySelectorAll('.auth-tab');
      var pwdForm = document.getElementById('pwdForm');
      var smsForm = document.getElementById('smsForm');
      tabs.forEach(function (t) {
        t.addEventListener('click', function () {
          tabs.forEach(function (x) { x.classList.remove('active'); });
          t.classList.add('active');
          var isPwd = t.getAttribute('data-tab') === 'pwd';
          pwdForm.style.display = isPwd ? '' : 'none';
          smsForm.style.display = isPwd ? 'none' : '';
        });
      });

      /* 显示 / 隐藏密码 */
      var togglePwd = document.getElementById('togglePwd');
      var pwdPass = document.getElementById('pwdPass');
      togglePwd.addEventListener('click', function () {
        pwdPass.type = pwdPass.type === 'password' ? 'text' : 'password';
      });

      /* 短信倒计时 */
      var sendBtn = document.getElementById('smsSendBtn');
      var smsPhone = document.getElementById('smsPhone');
      var countdown = 0;
      sendBtn.addEventListener('click', function () {
        if (!/^1\d{10}$/.test(smsPhone.value.trim())) {
          XLS.toast('请输入正确的 11 位手机号', 'error');
          return;
        }
        XLS.toast('验证码已发送（演示：任意 6 位数字）', 'success');
        countdown = 60;
        sendBtn.disabled = true;
        var timer = setInterval(function () {
          countdown--;
          sendBtn.textContent = countdown + 's 后重发';
          if (countdown <= 0) {
            clearInterval(timer);
            sendBtn.disabled = false;
            sendBtn.textContent = '获取验证码';
          }
        }, 1000);
      });

      /* 密码登录提交 */
      pwdForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var phone = pwdPhone.value.trim();
        var pass = pwdPass.value;
        var ok = true;

        if (!/^1\d{10}$/.test(phone) && !/^[a-zA-Z0-9_@.一-龥]{2,20}$/.test(phone)) {
          setError('phoneItem', 'pwdPhoneErr', '请输入正确的账号或手机号'); ok = false;
        } else clearError('phoneItem');
        if (pass.length < 6) {
          setError('pwdItem', 'pwdPassErr', '密码不能少于 6 位'); ok = false;
        } else clearError('pwdItem');

        if (!ok) return;

        var users = XLS.getUsers();
        var matched = users.filter(function (u) { return (u.phone === phone || u.account === phone) && u.password === pass; })[0];
        var isDemo = phone === '13800000000' && pass === '123456';
        // 尚未注册任何账号时，允许任意有效账号演示登录
        var fallback = users.length === 0;

        if (matched || isDemo || fallback) {
          var name = matched ? matched.name : (isDemo ? '张同学' : '张同学');
          localStorage.setItem('xxLoggedIn', name);
          XLS.toast('登录成功，欢迎回来！', 'success');
          setTimeout(function () { location.href = 'home.html'; }, 700);
        } else {
          setError('pwdItem', 'pwdPassErr', '账号或密码错误，请重试');
        }
      });

      /* 短信登录提交 */
      smsForm.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!/^1\d{10}$/.test(smsPhone.value.trim())) {
          XLS.toast('请输入正确的 11 位手机号', 'error'); return;
        }
        if (!/^\d{6}$/.test(smsCode.value.trim())) {
          XLS.toast('请输入 6 位数字验证码', 'error'); return;
        }
        var users = XLS.getUsers();
        var matched = users.filter(function (u) { return u.phone === smsPhone.value.trim(); })[0];
        localStorage.setItem('xxLoggedIn', matched ? matched.name : '张同学');
        XLS.toast('登录成功！', 'success');
        setTimeout(function () { location.href = 'home.html'; }, 700);
      });

      function setError(itemId, errId, msg) {
        document.getElementById(itemId).classList.add('has-error');
        document.getElementById(errId).textContent = msg;
      }
      function clearError(itemId) {
        document.getElementById(itemId).classList.remove('has-error');
      }
    })();
  </script>
</body>
</html>
